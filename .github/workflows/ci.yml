name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests need no Electron binary, so skip its download.
      - run: npm ci --ignore-scripts
      - run: npm test

  # Builds the installer for a tagged release and keeps it as a workflow artifact.
  # It does not publish: the release checklist (docs/RELEASE-CHECKLIST.md) is manual.
  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "Tag $GITHUB_REF does not match version $v"; exit 1; }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Lyric-Stars-Setup
          path: dist/Lyric-Stars-Setup-*.exe
          if-no-files-found: error
